<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b0a09">
<meta name="referrer" content="no-referrer">
<title>For you</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0a09; overflow: hidden;
    font-family: Palatino, "Palatino Linotype", "Times New Roman", serif;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #0b0a09;
  }
  video {
    width: 100%; height: 100%;
    object-fit: contain;
    background: #0b0a09;
  }
  #tap {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(11,10,9,0.28);
    color: #f7f2ea;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #tap.hidden { display: none; }
  .ring {
    width: 92px; height: 92px; border-radius: 50%;
    border: 2px solid #f7f2ea;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 22px;
    background: rgba(11,10,9,0.35);
  }
  .ring::after {
    content: "";
    width: 0; height: 0;
    border-style: solid;
    border-width: 16px 0 16px 26px;
    border-color: transparent transparent transparent #f7f2ea;
    margin-left: 6px;
  }
  #tap p { margin: 0; font-size: 22px; letter-spacing: 0.08em; }
</style>
</head>
<body>
<div id="stage">
  <video id="v" playsinline webkit-playsinline preload="auto" poster="poster.jpg" controls>
    <source src="movie.mp4" type="video/mp4">
  </video>
</div>
<div id="tap" role="button" aria-label="Play">
  <div class="ring"></div>
  <p>Tap to play</p>
</div>
<script>
(function () {
  var v = document.getElementById("v");
  var tap = document.getElementById("tap");
  function hide() { tap.classList.add("hidden"); }
  function play() {
    v.muted = false;
    var p = v.play();
    if (p && p.then) p.then(hide).catch(function () { tap.classList.remove("hidden"); });
    else hide();
  }
  v.muted = false;
  var attempt = v.play();
  if (attempt && attempt.then) {
    attempt.then(hide).catch(function () { tap.classList.remove("hidden"); });
  }
  tap.addEventListener("click", play);
  tap.addEventListener("touchend", function (e) { e.preventDefault(); play(); }, { passive: false });
})();
</script>
</body>
</html>
